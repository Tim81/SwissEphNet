name: Conformance oracle

# On pull_request (gated by paths -- only when the port or the oracle itself
# actually changed) as well as on a schedule and on demand. Whether it belongs
# on the PR path at all came down to cost: a full run dispatches all 12,757
# iterations in-process in ~2s (measured locally, Tools/ConformanceKnownFailGen,
# Release build) and `dotnet test` end-to-end (both TFMs, including host
# startup) in ~8s -- see README.md's "Correctness oracle" section for the
# measurement. That is cheap enough that not running it at review time (the
# primary evidence for whether a porting PR actually helped) would have been
# the wrong tradeoff, not a necessary one. The submodule checkout below is the
# only real cost, and is sparse + cached for exactly that reason.
on:
  pull_request:
    paths:
      - "SwissEphNet/**"
      - "Tests/SwissEphNet.Conformance.Tests/**"
      - "Tests/conformance/**"
      - "Tools/ConformanceKnownFailGen/**"
      - ".github/workflows/conformance.yml"
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Reproduces the same sparse, partial checkout used locally (see
      # README.md's "Correctness oracle" section) instead of a plain
      # `git submodule update --init`, which would pull the full ~444 MB tree
      # (sparse-checkout patterns live in the submodule's own
      # .git/info/sparse-checkout, local configuration that a fresh clone does
      # not inherit from .gitmodules). Cached on the pinned commit SHA
      # (external/swisseph is pinned to tag v2.10.3final and only moves in a
      # deliberate submodule-bump commit), so every run except the first after
      # a bump restores instantly instead of re-cloning.
      - name: Cache external/swisseph submodule
        id: submodule-cache
        uses: actions/cache@v4
        with:
          path: external/swisseph
          key: swisseph-submodule-af9823fe7b06ffefe3d3968fdc5680be8b5eec5f

      - name: Checkout external/swisseph submodule (sparse, ~25 MB)
        if: steps.submodule-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Kept in sync with the cache key above and external/swisseph's
          # actual gitlink (git ls-files --stage external/swisseph) -- this
          # workflow does not parse it out dynamically, to keep the "what
          # commit will this checkout" answer readable from this file alone.
          $pinnedSha = "af9823fe7b06ffefe3d3968fdc5680be8b5eec5f"
          git clone --filter=blob:none --no-checkout https://github.com/aloistr/swisseph.git external/swisseph
          Push-Location external/swisseph
          git config core.autocrlf false
          git sparse-checkout init --no-cone
          @(
            '/*.c'
            '/*.h'
            '/Makefile'
            '/LICENSE'
            '/setest/*'
            '/ephe/seas_12.se1'
            '/ephe/semo_12.se1'
            '/ephe/sepl_12.se1'
            '/ephe/seas_18.se1'
            '/ephe/semo_18.se1'
            '/ephe/sepl_18.se1'
            '/ephe/sefstars.txt'
            '/ephe/seorbel.txt'
            '/seleapsec.txt'
          ) | Set-Content .git/info/sparse-checkout
          git checkout $pinnedSha
          Pop-Location

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run conformance oracle
        shell: pwsh
        run: >
          dotnet test Tests/SwissEphNet.Conformance.Tests/SwissEphNet.Conformance.Tests.csproj
          -c Release
          --logger "console;verbosity=detailed"
          --logger trx
          --results-directory TestResults

      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: TestResults/*.trx
          if-no-files-found: ignore

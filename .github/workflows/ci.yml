name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  # github.event.pull_request.number, not github.ref: on pull_request, github.ref is
  # refs/pull/<n>/merge, while the push event for the same commit uses
  # refs/heads/<branch> -- different groups, so both would run side by side and a
  # same-repo PR branch would build every job twice per commit. Falling back to
  # github.ref for push (where pull_request.number is unset) keeps unrelated
  # branches from canceling each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ubuntu-24.04-arm, not macos-latest. The third leg exists for the architecture,
  # not the operating system: windows-latest and ubuntu-latest are both x64, so
  # without it nothing here ever builds or runs this library on arm64 -- and "pure
  # managed, runs anywhere .NET runs" (iOS, Apple Silicon, arm servers, WASM) is the
  # whole reason this port exists rather than a P/Invoke wrapper.
  #
  # macos-latest did provide that (it is macos-26-arm64), but it was the expensive
  # way to buy it: 10x the Actions minute multiplier if this repo ever stops being
  # public, and materially worse queue times even while it is free -- a macOS job on
  # this repo has sat pending for tens of minutes and once hung for 15 before a
  # re-run passed the same commit in 42 seconds. ubuntu-24.04-arm gives the same
  # arm64 coverage at the 1x Linux rate and schedules like the other Linux jobs.
  #
  # What that trades away is Apple's libSystem, which is a real difference from
  # glibc for a numerical library. Nothing currently measures it: this job runs the
  # same 248 unit tests as the x64 Linux job, asserting to roughly six decimals, so
  # it would catch gross breakage and not the ULP-level divergence that actually
  # separates platforms. The gate that *does* measure that (scripts/verify-baseline.ps1)
  # is deliberately Windows-locked, with Linux x64 tracked report-only in
  # baseline.yml because 47,052 of 3.45M fields genuinely diverge between them.
  # arm64 is a third platform nobody has measured, and docs/known-issues.md already
  # anticipates arm-specific divergence (plain char is unsigned by default there).
  # Adding an arm64 report-only baseline job is the follow-up that would make this
  # leg earn its keep; until then it is a build-and-unit-test smoke check.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # Both runtimes, not just 10.0.x: the test project targets
          # net8.0;net10.0, and the 10.0 SDK does not carry the 8.0 runtime on its
          # own, so the net8.0 leg fails to launch without it installed explicitly.
          dotnet-version: |
            8.0.x
            10.0.x

      # SweWin (net10.0-windows, WinForms) only builds on Windows -- see
      # SwissEphNet.CrossPlatform.slnf and the note in CONTRIBUTING.md/README.
      - name: Build (Windows, full solution including SweWin)
        if: runner.os == 'Windows'
        run: dotnet build SwissEphNet.sln -c ${{ matrix.configuration }}

      - name: Build (cross-platform subset)
        if: runner.os != 'Windows'
        run: dotnet build SwissEphNet.CrossPlatform.slnf -c ${{ matrix.configuration }}

      - name: Test
        run: dotnet test Tests/SwissEphNet.Tests/SwissEphNet.Tests.csproj -c ${{ matrix.configuration }} --no-build --logger trx --results-directory TestResults

      # net462 and net48, so Windows only (same reasoning as the SweWin build step
      # above). Exercises the netstandard2.0 asset, which nothing else here runs --
      # see the comment atop Tests/NetStandard20Smoke.Tests/NetStandard20Smoke.Tests.csproj.
      # dotnet test with no --framework runs both TFMs from this one invocation.
      # Already built by the full-solution build above (this project is part of
      # SwissEphNet.sln, not SwissEphNet.CrossPlatform.slnf), hence --no-build.
      - name: Test (netstandard2.0 smoke)
        if: runner.os == 'Windows'
        run: dotnet test Tests/NetStandard20Smoke.Tests/NetStandard20Smoke.Tests.csproj -c ${{ matrix.configuration }} --no-build --logger trx --results-directory TestResults

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.configuration }}
          path: TestResults/*.trx

  # The transliteration freeze is enforced here, not by .editorconfig. The nested
  # .editorconfig files pin trim_trailing_whitespace and insert_final_newline, which
  # holds, but there is no .editorconfig value meaning "preserve brace placement" --
  # `none` is as strong an instruction as `all`, just pointing the other way, and
  # pinning it was measured to widen the damage rather than prevent it. So a check
  # that looks at the files themselves is the only real guard, and it catches a
  # reformatting regardless of which tool caused it.
  verify-freeze:
    name: Transliteration freeze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen paths were not reformatted
        shell: pwsh
        run: pwsh scripts/verify-freeze.ps1

  # SwissEphNet.csproj has no PackageReference, and the packed nuspec has an empty
  # dependency group per target framework and no framework references -- a deliberate
  # property (the 2.8.1.0 release dropped System.Text.Encoding.CodePages rather than
  # keep a dependency for Windows-1252 support), not an accident. This job packs the
  # library the way it actually ships and fails if the nuspec ever names a dependency.
  verify-no-dependencies:
    name: No package dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Both runtimes: the library multi-targets netstandard2.0;net8.0;net10.0, and
          # packing needs the net8.0 SDK/runtime present alongside net10.0.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify the packed library has no dependencies
        shell: pwsh
        run: pwsh scripts/verify-no-dependencies.ps1

  # Still no general `dotnet format --verify-no-changes` job: the pre-existing SweWin
  # WinForms code (never previously run through dotnet format) has formatting debt
  # unrelated to any current change, and gating every PR on fixing it is a separate
  # piece of work. verify-freeze above covers the part that actually matters, since
  # the frozen transliterations are the only files where formatting is load-bearing.
  # Whoever adds the general job must run it as
  # `dotnet format SwissEphNet.sln --verify-no-changes --exclude SwissEphNet/CPort/ --exclude Programs/SweTest/Program.cs --exclude Programs/SweMini/Program.cs`
  # -- see CONTRIBUTING.md for why all three exclusions are mandatory.

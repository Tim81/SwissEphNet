name: Characterization baseline

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Push (all branches) + pull_request means a same-repo PR branch would otherwise run
# this workflow twice for the same commit; cancel the older run instead of paying for both.
# github.event.pull_request.number, not github.ref: on pull_request, github.ref is
# refs/pull/<n>/merge, while the push event for the same commit uses refs/heads/<branch>
# -- different groups, so both would run side by side instead of the push run being
# canceled. Falling back to github.ref for push (where pull_request.number is unset)
# keeps unrelated branches from canceling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Primary gate. global.json (repo root) pins the SDK to the 10.0 major.minor line
  # so the runtime the tolerance is meant to insure against does not itself drift
  # silently underneath this job.
  verify-baseline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: verify-baseline-log.ps1 (below)
          # diffs HEAD against the PR base / previous push commit to decide whether
          # Tests/baseline/*.tsv changed, and a shallow checkout may not even have that
          # commit present locally to diff against.
          fetch-depth: 0

      - name: Determine base ref for baseline-log check
        id: base-ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            # github.event.before is all-zeros for the first push of a new branch --
            # nothing to diff against *on this ref*, but falling back to the repo's
            # literal root commit was its own bypass: the sidecar-regenerations log
            # accumulated over the repo's entire history sits between the root commit
            # and here, so "count at root -> count now" is a large, unconditional gain
            # that has nothing to do with whether *this push*'s own commits added an
            # entry. That made every first push of every new branch a free pass,
            # silently -- this workflow's pull_request leg still catches the same PR
            # later, so it read as a decorative gap rather than a wrong verdict, but it
            # is still wrong on its own terms.
            #
            # The actual base for "what did this push add" is the fork point: the
            # nearest commit this branch shares with anything already on the remote.
            # actions/checkout with fetch-depth 0 only fetches full history of the ref
            # being built, not other branches' tips, so those have to be fetched
            # explicitly before merge-base can see them.
            # A force-push needs the same treatment for a different reason:
            # github.event.before names the pre-push tip of the branch, and a rebase or
            # amend orphans that commit. GitHub still reports it, but it is not
            # reachable from any ref, so fetch-depth 0 does not bring it into the clone
            # and the log check cannot diff against it. That is a real, recurring case
            # rather than an edge one: every rebase of a long-running branch onto a
            # moved integration branch hits it, and the port will do that repeatedly.
            #
            # Failing closed there is the safe direction, but it is still a false
            # failure, and a gate that cries wolf on ordinary rebases is a gate people
            # learn to wave through. Resolve the fork point instead, which is the same
            # question the first-push case asks: what did this branch add relative to
            # what the remote already had.
            need_forkpoint=0
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              need_forkpoint=1
            elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "Base ref $base is not reachable (force-push or rebase); resolving the fork point instead."
              need_forkpoint=1
            fi
            if [ "$need_forkpoint" = "1" ]; then
              git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' --prune
              best=""
              for candidate in $(git for-each-ref --format='%(objectname)' refs/remotes/origin/); do
                mb=$(git merge-base HEAD "$candidate" 2>/dev/null) || continue
                if [ -z "$best" ]; then
                  best="$mb"
                elif git merge-base --is-ancestor "$best" "$mb" 2>/dev/null; then
                  # $mb is a descendant of (more recent than) $best -- prefer it, the
                  # closest shared ancestor found so far across every known branch.
                  best="$mb"
                fi
              done
              if [ -n "$best" ]; then
                base="$best"
              else
                # No other branch to compare against at all (e.g. the very first
                # commit in the repository's entire history) -- genuinely nothing to
                # diff, not a bypass. This is the one case the root-commit fallback
                # was actually correct for.
                base=$(git rev-list --max-parents=0 HEAD | tail -n1)
              fi
            fi
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Verify baseline changes are logged
        shell: pwsh
        run: pwsh scripts/verify-baseline-log.ps1 -BaseRef '${{ steps.base-ref.outputs.sha }}'

      - uses: actions/setup-dotnet@v4
        with:
          # Both runtimes: scripts/verify-baseline.ps1 runs BaselineVerify against
          # both net8.0 and net10.0 (see Tools/BaselineGen/README.md, "Why net8.0
          # and net10.0"), and the 10.0 SDK does not carry the 8.0 runtime on its own.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run gate unit tests
        shell: pwsh
        run: dotnet test Tools/BaselineVerify.Tests -c Release

      - name: Verify baseline
        shell: pwsh
        run: pwsh scripts/verify-baseline.ps1

  # Informational only, never a gate. The baseline is Windows-generated and this
  # gate is deliberately locked to Windows: a measured Windows-vs-Linux run found
  # 47,052 of 3.4M numeric fields differing (92.66% ULP noise already covered by the
  # tolerance, 5.60% angle-wraparound now handled directly, 1.74% genuine
  # divergence including one real numerical-stability bug -- see
  # Tools/BaselineGen/README.md and docs/known-issues.md). A single tolerance loose
  # enough to pass on Linux would need to be loose enough to hide real regressions,
  # so instead of widening it, this job just tracks the drift over time in
  # --report-only mode, which never fails by design. continue-on-error is still set
  # as a backstop in case the test suite itself breaks on Linux for an unrelated
  # reason (a real thing worth seeing), not because the report step could fail.
  verify-baseline-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Both runtimes; see the note on the same step in verify-baseline above.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run gate unit tests
        shell: pwsh
        run: dotnet test Tools/BaselineVerify.Tests -c Release

      - name: Report cross-platform divergence (never fails)
        shell: pwsh
        run: pwsh scripts/verify-baseline.ps1 -ReportOnly

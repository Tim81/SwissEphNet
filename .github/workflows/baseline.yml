name: Characterization baseline

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify-baseline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify baseline
        shell: pwsh
        run: pwsh scripts/verify-baseline.ps1
